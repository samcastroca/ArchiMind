# Catálogo fijo de las pruebas: completar catalog.yaml con medidas reales no las cambia.
profiles:
  prueba:
    name: Perfil de prueba
    types:
      [swing_door, double_swing_door, sliding_door, sliding_window, fixed_window, awning_window]
    frame: {face: 0.05, depth: 0.08}
    sash: {face: 0.04, depth: 0.025}
    overlap: 0.03
    glass: 0.006
    sash_width: {min: 0.30, max: 1.20}
    sash_height: {min: 0.30, max: 2.40}

  # Marco de poco fondo: no le caben tres rieles.
  estrecho:
    name: Perfil estrecho
    types: [sliding_window, fixed_window]
    frame: {face: 0.04, depth: 0.06}
    sash: {face: 0.035, depth: 0.025}
    overlap: 0.025
    glass: 0.004
    sash_width: {min: 0.30, max: 1.00}
    sash_height: {min: 0.30, max: 1.50}
