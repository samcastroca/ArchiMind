[project]
name = "archimind-vision"
version = "0.1.0"
description = "Servidor MCP archimind-vision: lectura de planos en imagen."
requires-python = ">=3.11"
dependencies = ["archimind-schema"]

[tool.uv.sources]
archimind-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
