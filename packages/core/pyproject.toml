[project]
name = "archimind-core"
version = "0.1.0"
description = "Servidor MCP archimind-core: único escritor del modelo semántico de un proyecto."
requires-python = ">=3.11"
dependencies = [
    "archimind-schema",
    "ezdxf>=1.4.5",
    "matplotlib>=3.11.2",
    "mcp>=2.3",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "shapely>=2.1",
]

[project.scripts]
archimind-core = "archimind_core.server:main"

[tool.uv.sources]
archimind-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
