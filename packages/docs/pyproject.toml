[project]
name = "archimind-docs"
version = "0.1.0"
description = "Servidor MCP archimind-docs: memoria, presupuesto, programa de áreas y ficha PDF."
requires-python = ">=3.11"
dependencies = [
    "archimind-core",
    "archimind-schema",
    "platformdirs>=4",
    "pydantic>=2",
]

[project.scripts]
archimind-docs-importar = "archimind_docs.importers:main"

[tool.uv.sources]
archimind-core = { workspace = true }
archimind-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
