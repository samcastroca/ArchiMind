[project]
name = "archimind"
version = "0.1.0"
description = "Procesamiento de planos arquitectónicos con IA mediante servidores MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "archimind-schema",
    "archimind-core",
    "archimind-bloques",
    "archimind-docs",
    "archimind-vision",
    "archimind-rhino-bridge",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
    "ezdxf>=1.4.5",
    "types-pyyaml>=6.0.12.20260906",
    "types-reportlab>=5.0.0.20261008",
]

[tool.uv.workspace]
members = ["packages/*", "bridges/rhino/mcp"]

[tool.uv.sources]
archimind-schema = { workspace = true }
archimind-core = { workspace = true }
archimind-bloques = { workspace = true }
archimind-docs = { workspace = true }
archimind-vision = { workspace = true }
archimind-rhino-bridge = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "bridges", "tests"]
addopts = "--import-mode=importlib"
pythonpath = [
    "packages/schema/tests",
    "packages/bloques/tests",
    "bridges/rhino/plugin",
    "bridges/rhino/mcp/tests",
    "tests/fixtures",
    "scripts",
]

[tool.ruff]
target-version = "py311"
line-length = 100

# El script del puente corre dentro de Rhino 8, que trae CPython 3.9.
[tool.ruff.per-file-target-version]
"bridges/rhino/plugin/**/*.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "tests/fixtures"
strict = true

[[tool.mypy.overrides]]
module = ["shapely", "shapely.*"]
ignore_missing_imports = true

# ezdxf reexporta su API pública sin __all__; con strict, mypy no la vería.
[[tool.mypy.overrides]]
module = ["ezdxf", "ezdxf.*"]
implicit_reexport = true

# odafc empieza con `# type: ignore`: mypy lo vería vacío. Sin seguirlo, queda como Any.
[[tool.mypy.overrides]]
module = ["ezdxf.addons.odafc"]
follow_imports = "skip"

# El script del puente usa RhinoCommon, sin tipos fuera de Rhino: las pruebas lo ven como Any.
[[tool.mypy.overrides]]
module = ["archimind_bridge"]
follow_imports = "skip"
ignore_missing_imports = true
