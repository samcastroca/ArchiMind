[project]
name = "archimind"
version = "0.1.0"
description = "Procesamiento de planos arquitectónicos con IA mediante servidores MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "archimind-schema",
    "archimind-core",
    "archimind-bloques",
    "archimind-docs",
    "archimind-vision",
]

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
archimind-schema = { workspace = true }
archimind-core = { workspace = true }
archimind-bloques = { workspace = true }
archimind-docs = { workspace = true }
archimind-vision = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
