[project]
name = "archimind-rhino-bridge"
version = "0.1.0"
description = "Servidor MCP rhino-bridge: el modelo de ArchiMind en Rhino 8 a través del puente, con axonometrías y cortes."
requires-python = ">=3.11"
dependencies = [
    "archimind-core",
    "archimind-schema",
    "ezdxf>=1.4.5",
    "mcp>=2.3",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rhino3dm>=8.35.0",
    "shapely>=2.1",
]

[project.scripts]
archimind-rhino-bridge = "archimind_rhino_bridge.server:main"

[tool.uv.sources]
archimind-core = { workspace = true }
archimind-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
